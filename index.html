<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LEI 魔法氣象台</title>
  <link rel="icon" type="image/png" href="./icon-v2.png">
  <link rel="apple-touch-icon" href="./icon-v2.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
    rel="stylesheet">

  <style>
    :root {
      /* 魔法學院色系 */
      --hp-bg-night: #050712;
      --hp-bg-deep: #0c1020;
      --hp-gold: #d3a757;
      --hp-gold-soft: #f0d8a6;
      --hp-ink: #f7f4e9;
      --hp-ink-dark: #2b2721;
      --hp-border-gold: #c09a4a;
      --hp-accent-red: #7b2222;
      --hp-accent-blue: #203a63;
      --hp-accent-green: #234f3a;
      --hp-shadow: 0 18px 40px rgba(0, 0, 0, 0.7);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Zen Maru Gothic', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      min-height: 100vh;
      color: var(--hp-ink);
      overflow-x: hidden;
      padding-bottom: 24px;
      background:
        radial-gradient(circle at 20% 0%, #272b4a 0, #050712 45%) fixed,
        radial-gradient(circle at 80% 100%, #1d2b3e 0, #050712 55%) fixed;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, 0.35), transparent),
        radial-gradient(1px 1px at 80% 30%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 50% 80%, rgba(255, 255, 255, 0.25), transparent),
        radial-gradient(1px 1px at 30% 60%, rgba(255, 255, 255, 0.2), transparent);
      opacity: 0.6;
      z-index: -1;
    }

    body::after {
      animation: twinkle 10s infinite alternate;
      opacity: 0.4;
    }

    @keyframes twinkle {
      0% {
        opacity: 0.2;
      }

      100% {
        opacity: 0.6;
      }
    }

    /* 頂部狀態列 */
    .status-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background:
        linear-gradient(to bottom, rgba(12, 16, 32, 0.95), rgba(5, 7, 18, 0.9));
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(208, 168, 92, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(250, 231, 180, 0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      background: radial-gradient(circle at 30% 20%, #fdf6d5, #c3973e);
      box-shadow: 0 0 15px rgba(255, 228, 150, 0.6);
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 0.96rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--hp-ink);
    }

    .location-pill {
      background: rgba(7, 10, 25, 0.9);
      color: var(--hp-gold-soft);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid rgba(240, 216, 166, 0.6);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7);
      margin-top: 2px;
    }

    .location-pill span.label {
      opacity: 0.8;
    }

    .location-pill span.city {
      font-weight: 700;
    }

    .update-pill {
      font-size: 0.75rem;
      color: var(--hp-gold-soft);
      background: radial-gradient(circle at 20% 0%, rgba(82, 108, 163, 0.9), rgba(11, 19, 43, 0.95));
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(208, 168, 92, 0.7);
      box-shadow: 0 0 12px rgba(61, 95, 177, 0.7);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .update-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7cf5ff;
      box-shadow: 0 0 8px rgba(143, 243, 255, 0.8);
      animation: glow 1.6s infinite alternate;
    }

    @keyframes glow {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }

      100% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    .container {
      padding: 20px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* === 今日焦點卡片 === */
    .hero-card {
      position: relative;
      background: radial-gradient(circle at 20% 10%, #fff9e3, #e3cf9e);
      border-radius: 26px;
      padding: 28px 22px 24px;
      border: 2px solid rgba(142, 108, 40, 0.9);
      box-shadow: var(--hp-shadow);
      color: var(--hp-ink-dark);
      overflow: visible; /* 讓晨間占卜完整顯示 */
      isolation: isolate;
    }

    .hero-card::before,
    .hero-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      mix-blend-mode: multiply;
      border-radius: inherit;
    }

    .hero-card::before {
      background-image:
        radial-gradient(circle at 10% 0%, rgba(175, 126, 47, 0.12), transparent 55%),
        radial-gradient(circle at 90% 100%, rgba(104, 71, 28, 0.16), transparent 60%);
      opacity: 0.9;
    }

    .hero-card::after {
      background-image:
        repeating-linear-gradient(0deg,
          transparent 0px,
          transparent 10px,
          rgba(0, 0, 0, 0.06) 11px,
          transparent 12px);
      opacity: 0.4;
    }

    .hero-period {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 22px;
      border-radius: 999px;
      background: linear-gradient(to right, #4e2642, #1d264d);
      color: var(--hp-ink);
      font-family: 'Cinzel', serif;
      font-size: 0.86rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(247, 225, 177, 0.8);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-period::before {
      content: "★";
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .hero-period::after {
      content: "★";
      font-size: 0.7rem;
      opacity: 0.8;
    }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .hero-title-group {
      text-align: left;
    }

    .hero-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4e2c16;
      margin-bottom: 5px;
    }

    .hero-subtitle {
      font-size: 0.82rem;
      color: #6a4c2b;
    }

    .hero-sigil {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 2px solid rgba(102, 73, 35, 0.8);
      background:
        radial-gradient(circle at 25% 0%, #fdf3d5, #cda96e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 0 10px rgba(242, 216, 132, 0.6);
    }

    .hero-temp-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 12px 0 10px;
      position: relative;
      z-index: 1;
    }

    .hero-icon {
      font-size: 4.2rem;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.25));
      animation: floatSpell 4s ease-in-out infinite;
    }

    @keyframes floatSpell {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-10px) rotate(-2deg);
      }
    }

    .hero-temp {
      font-size: 4rem;
      font-weight: 900;
      color: #3b2b1a;
      line-height: 1;
      position: relative;
    }

    .hero-temp::after {
      content: "°C";
      position: absolute;
      top: 0.2em;
      right: -1.5em;
      font-size: 0.9rem;
      color: #675033;
    }

    .hero-desc {
      font-size: 1.15rem;
      color: #4e3723;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .hero-desc::before {
      content: "「";
      margin-right: 2px;
      opacity: 0.7;
    }

    .hero-desc::after {
      content: "」";
      margin-left: 2px;
      opacity: 0.7;
    }

    .advice-section-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-family: 'Cinzel', serif;
      color: #7a5a31;
      margin-bottom: 6px;
    }

    .advice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px dashed rgba(124, 90, 46, 0.55);
      position: relative;
      z-index: 1;
    }

    .advice-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 8px;
      border-radius: 18px;
      background: rgba(255, 250, 236, 0.9);
      border: 1px solid rgba(136, 102, 55, 0.6);
      box-shadow: 0 9px 14px rgba(43, 27, 10, 0.25);
    }

    .advice-item:nth-child(1) {
      background: linear-gradient(135deg, #fffbee, #f4e0b7);
    }

    .advice-item:nth-child(2) {
      background: linear-gradient(135deg, #fff9f0, #f4d6bc);
    }

    .advice-icon {
      font-size: 1.9rem;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
    }

    .advice-text {
      font-size: 1rem;
      font-weight: 900;
      color: #4a321c;
      margin: 2px 0 4px;
      line-height: 1.2;
    }

    .advice-sub {
      font-size: 0.72rem;
      color: #7b6343;
    }

    /* 幸運區塊 */
    .magic-extras {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1.4fr 1.2fr;
      gap: 10px;
    }

    .magic-card {
      background: radial-gradient(circle at 20% 0%, rgba(12, 17, 37, 0.95), rgba(3, 4, 13, 0.98));
      border-radius: 18px;
      padding: 12px 14px 14px;
      border: 1px solid rgba(210, 178, 110, 0.9);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    .magic-card::before {
      content: "";
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.08), transparent 55%);
      pointer-events: none;
    }

    .magic-card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--hp-gold-soft);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .magic-card-title span.icon {
      font-size: 0.9rem;
    }

    .magic-card-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .magic-color-block {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.8);
    }

    .magic-color-text {
      font-size: 0.86rem;
      color: var(--hp-ink);
    }

    .magic-color-text .name {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .magic-color-text .code {
      font-size: 0.75rem;
      opacity: 0.85;
    }

    .magic-color-text .desc {
      font-size: 0.75rem;
      opacity: 0.9;
      margin-top: 3px;
    }

    .magic-zodiac-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f7f1da;
      margin-bottom: 2px;
    }

    .magic-zodiac-name span.en {
      font-size: 0.7rem;
      opacity: 0.8;
      margin-left: 4px;
    }

    .magic-zodiac-desc {
      font-size: 0.78rem;
      color: #d9e0ff;
    }

    .magic-quote {
      margin-top: 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      color: #f0e8d5;
      position: relative;
      padding-left: 12px;
      border-left: 1px solid rgba(240, 216, 166, 0.4);
    }

    .magic-quote::before {
      content: "“";
      position: absolute;
      left: -4px;
      top: -4px;
      font-size: 1.2rem;
      opacity: 0.6;
      color: #f0d8a6;
    }

    /* 區塊標題 */
    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: var(--hp-gold-soft);
      margin: 20px 0 12px 4px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(240, 216, 166, 0.6));
    }

    .section-title::before {
      background: linear-gradient(to left, transparent, rgba(240, 216, 166, 0.6));
    }

    /* 未來預報卡片 */
    .scroll-container {
      display: flex;
      overflow-x: auto;
      gap: 14px;
      padding-bottom: 6px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .scroll-container::-webkit-scrollbar {
      display: none;
    }

    .mini-card {
      min-width: 132px;
      background: radial-gradient(circle at 20% 0%, #1c2039, #050712);
      border-radius: 20px;
      padding: 12px 10px 14px;
      text-align: center;
      border: 1px solid rgba(234, 205, 147, 0.8);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mini-card::before {
      content: "";
      position: absolute;
      inset: -30%;
      background:
        radial-gradient(circle at 50% 0%, rgba(137, 205, 255, 0.22), transparent 50%);
      opacity: 0.8;
      pointer-events: none;
    }

    .mini-time {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--hp-gold-soft);
      background: rgba(6, 12, 34, 0.9);
      border: 1px solid rgba(208, 168, 92, 0.7);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .mini-icon {
      font-size: 2.2rem;
      margin: 2px 0 4px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 6px 9px rgba(0, 0, 0, 0.7));
    }

    .mini-temp {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--hp-ink);
      position: relative;
      z-index: 1;
    }

    .mini-rain {
      font-size: 0.75rem;
      color: #c5d7ff;
      margin-top: 4px;
      position: relative;
      z-index: 1;
    }

    /* Loading 畫面 */
    .loading-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 0%, #2a264d, #050712);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .loading-orb {
      width: 96px;
      height: 96px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 30% 10%, #ffffff, #b7d5ff 40%, #26356b 75%, #050712 100%);
      box-shadow:
        0 0 30px rgba(155, 201, 255, 0.9),
        0 0 80px rgba(81, 124, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: orbPulse 2.4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .loading-orb::after {
      content: "✨";
      font-size: 2.2rem;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
    }

    @keyframes orbPulse {
      0% {
        transform: translateY(0) scale(0.96);
        box-shadow:
          0 0 24px rgba(155, 201, 255, 0.7),
          0 0 50px rgba(81, 124, 255, 0.6);
      }

      50% {
        transform: translateY(-6px) scale(1.05);
        box-shadow:
          0 0 40px rgba(155, 201, 255, 1),
          0 0 90px rgba(81, 124, 255, 0.95);
      }

      100% {
        transform: translateY(0) scale(0.96);
        box-shadow:
          0 0 24px rgba(155, 201, 255, 0.7),
          0 0 50px rgba(81, 124, 255, 0.6);
      }
    }

    .loading-text {
      margin-top: 20px;
      color: var(--hp-ink);
      font-size: 0.9rem;
      text-align: center;
      line-height: 1.5;
    }

    .loading-text span {
      display: block;
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 4px;
    }

    @media (max-width: 480px) {
      .magic-extras {
        grid-template-columns: 1fr;
      }
    }

    @media (min-width: 480px) {
      .hero-temp {
        font-size: 4.4rem;
      }

      .hero-icon {
        font-size: 4.6rem;
      }

      .mini-card {
        min-width: 140px;
      }
    }
  </style>
</head>

<body>
  <!-- Loading：魔法占卜中 -->
  <div id="loading" class="loading-screen">
    <div class="loading-orb"></div>
    <p class="loading-text">
      正在從魔法氣象塔召喚預言…
      <span>請稍候，貓頭鷹正在送來高雄的天氣卷軸。</span>
    </p>
  </div>

  <!-- 狀態列 -->
  <div class="status-bar">
    <div class="status-left">
      <div class="brand-logo">L</div>
      <div>
        <div class="brand-title">LEI Magical Forecast</div>
        <div class="location-pill">
          <span class="label">魔法座標</span>
          <span class="city">｜台北</span>
        </div>
      </div>
    </div>
    <div id="updateTime" class="update-pill">
      <span class="update-dot"></span>
      <span>載入預言中…</span>
    </div>
  </div>

  <div class="container" id="mainContent" style="display: none;">
    <div id="heroCard"></div>

    <!-- 今日幸運區塊 -->
    <div id="magicExtras" class="magic-extras"></div>

    <h3 class="section-title">未來時段預言</h3>
    <div class="scroll-container" id="futureForecasts"></div>
  </div>

  <script>
    const API_URL = "https://weather-taipei-lei.zeabur.app/api/weather/kaohsiung";

    // ===== 隨機資料：幸運色、星座、魔法小語 =====
    const LUCKY_COLORS = [
      { name: "Phoenix Gold", code: "#D9A441", desc: "象徵重生與勇氣，適合展開新計畫的顏色。" },
      { name: "Moony Silver", code: "#C6D2E0", desc: "月光般的理性，幫助你做出清晰決定。" },
      { name: "Forest Essence", code: "#3E6B52", desc: "來自森林的守護力量，穩定心情與步伐。" },
      { name: "Arcane Purple", code: "#5E3A82", desc: "古老咒語的殘留魔力，適合需要靈感的一天。" },
      { name: "Starlit Blue", code: "#244C7A", desc: "星空的顏色，為遠方的目標帶來指引。" },
      { name: "Ember Red", code: "#8C2B2B", desc: "龍族火焰般的熱情，鼓勵你主動爭取機會。" },
      { name: "Misty Beige", code: "#D8CBB1", desc: "像羊皮紙一樣柔和，適合整理思緒與計畫。" },
      { name: "Morning Butter", code: "#F7DCA3", desc: "讓人放鬆的奶油光感，適合與人溝通、合作。" }
    ];

    const ZODIACS = [
      { zh: "牡羊座", en: "Aries", desc: "今日行動力特別旺，適合主動出擊與嘗試新魔法。" },
      { zh: "金牛座", en: "Taurus", desc: "穩定的土元素支撐你，把未完成的任務慢慢收尾。" },
      { zh: "雙子座", en: "Gemini", desc: "訊息與靈感像貓頭鷹信件一樣飛來，適合溝通與腦力激盪。" },
      { zh: "巨蟹座", en: "Cancer", desc: "情緒感受特別敏銳，很適合照顧自己與身邊的人。" },
      { zh: "獅子座", en: "Leo", desc: "聚光燈自然落在你身上，勇敢表現自己會有好結果。" },
      { zh: "處女座", en: "Virgo", desc: "細節檢查魔法特別強，適合整理文件與調整計畫。" },
      { zh: "天秤座", en: "Libra", desc: "適合談合作與協調，有利達成雙贏的魔法契約。" },
      { zh: "天蠍座", en: "Scorpio", desc: "洞察力大幅提升，適合深入研究與面對真正在意的事。" },
      { zh: "射手座", en: "Sagittarius", desc: "冒險與學習運勢佳，適合探索新領域或開啟新專案。" },
      { zh: "魔羯座", en: "Capricorn", desc: "耐心與實作力在線，一步步前進就能看見成果。" },
      { zh: "水瓶座", en: "Aquarius", desc: "創意魔法充沛，很適合打破舊框架、嘗試不同做法。" },
      { zh: "雙魚座", en: "Pisces", desc: "直覺與靈感特別敏銳，安靜下來就能聽見內心的聲音。" }
    ];

    const MAGIC_QUOTES = [
      "別小看今天完成的一點點，它們會在未來組成很大的魔法。",
      "天氣也許多變，但你能選擇用什麼心情面對它。",
      "就算是陰天，雲層後面依然藏著完整的太陽。",
      "今天的你不需要完美，只需要比昨天前進半步。",
      "魔法師不一定要很忙，但一定要清楚自己正在朝哪裡前進。",
      "如果覺得步伐太快，不妨停下來，讓心跟上來。",
      "世界可能很吵，但你可以替自己的心按下靜音鍵。",
      "天氣是外在的預報，心情則是你可以親手寫下的魔法。"
    ];

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // ===== 原本的氣象函式 =====
    function getWeatherIcon(weather) {
      if (!weather) return "🌤️";
      if (weather.includes("晴")) return "☀️";
      if (weather.includes("多雲")) return "⛅";
      if (weather.includes("陰")) return "☁️";
      if (weather.includes("雨")) return "🌧️";
      if (weather.includes("雷")) return "⛈️";
      return "🌤️";
    }

    function getAdvice(rainProb, maxTemp) {
      let rainIcon = "🪄";
      let rainText = "今日無需防雨咒";
      if (parseInt(rainProb) > 30) {
        rainIcon = "☂️";
        rainText = "啟動防水咒：請帶傘";
      }

      let clothIcon = "🧙‍♂️";
      let clothText = "輕便巫師袍就好";
      if (parseInt(maxTemp) >= 28) {
        clothIcon = "🧥";
        clothText = "高溫預警：薄外袍或短袖";
      } else if (parseInt(maxTemp) <= 20) {
        clothIcon = "🧣";
        clothText = "溫度偏低：加上圍巾與外袍";
      }

      return { rainIcon, rainText, clothIcon, clothText };
    }

    function getTimePeriod(startTime) {
      const hour = new Date(startTime).getHours();
      if (hour >= 5 && hour < 11) return "晨間占卜";
      if (hour >= 11 && hour < 14) return "午間預言";
      if (hour >= 14 && hour < 18) return "午後觀星";
      if (hour >= 18 && hour < 23) return "夜間巡禮";
      return "深夜守夜人";
    }

    function renderMagicExtras() {
      const luckyColor = getRandomItem(LUCKY_COLORS);
      const luckyZodiac = getRandomItem(ZODIACS);
      const quote = getRandomItem(MAGIC_QUOTES);

      const extras = document.getElementById('magicExtras');
      extras.innerHTML = `
        <div class="magic-card">
          <div class="magic-card-title">
            <span class="icon">🎨</span>
            <span>今日幸運色 · MAGIC COLOR</span>
          </div>
          <div class="magic-card-main">
            <div class="magic-color-block" style="background:${luckyColor.code};"></div>
            <div class="magic-color-text">
              <div class="name">${luckyColor.name}</div>
              <div class="code">${luckyColor.code}</div>
              <div class="desc">${luckyColor.desc}</div>
            </div>
          </div>
        </div>

        <div class="magic-card">
          <div class="magic-card-title">
            <span class="icon">⭐</span>
            <span>今日幸運星 · LUCKY CONSTELLATION</span>
          </div>
          <div class="magic-card-main">
            <div>
              <div class="magic-zodiac-name">
                ${luckyZodiac.zh}
                <span class="en">${luckyZodiac.en}</span>
              </div>
              <div class="magic-zodiac-desc">${luckyZodiac.desc}</div>
            </div>
          </div>
          <div class="magic-quote">${quote}</div>
        </div>
      `;
    }

    function renderWeather(data) {
      const forecasts = data.forecasts;
      const current = forecasts[0];
      const others = forecasts.slice(1);

      const advice = getAdvice(current.rain, current.maxTemp);
      const period = getTimePeriod(current.startTime);
      const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

      document.getElementById('heroCard').innerHTML = `
        <div class="hero-card">
          <div class="hero-period">${period}</div>

          <div class="hero-top-row">
            <div class="hero-title-group">
              <div class="hero-title">今日魔法氣象</div>
              <div class="hero-subtitle">高雄 · 巫師天氣觀測站</div>
            </div>
            <div class="hero-sigil">☾</div>
          </div>

          <div class="hero-temp-container">
            <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
            <div class="hero-temp">${avgTemp}</div>
          </div>

          <div class="hero-desc">${current.weather}</div>

          <div class="advice-section-label">SPELL &amp; OUTFIT · 今日咒語與穿搭</div>
          <div class="advice-grid">
            <div class="advice-item">
              <div class="advice-icon">${advice.rainIcon}</div>
              <div class="advice-text">${advice.rainText}</div>
              <div class="advice-sub">降雨機率 ${current.rain}</div>
            </div>
            <div class="advice-item">
              <div class="advice-icon">${advice.clothIcon}</div>
              <div class="advice-text">${advice.clothText}</div>
              <div class="advice-sub">最高溫 ${current.maxTemp}° · 最低溫 ${current.minTemp}°</div>
            </div>
          </div>
        </div>
      `;

      // 幸運色 / 星座 / 小語
      renderMagicExtras();

      // 未來預報
      const scrollContainer = document.getElementById('futureForecasts');
      scrollContainer.innerHTML = '';

      const todayDate = new Date().getDate();

      others.forEach(f => {
        let p = getTimePeriod(f.startTime);
        const fDate = new Date(f.startTime);
        if (fDate.getDate() !== todayDate) {
          p = "明日 · " + p;
        }

        scrollContainer.innerHTML += `
          <div class="mini-card">
            <div class="mini-time">${p}</div>
            <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
            <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
            <div class="mini-rain">💧 降雨率 ${f.rain}</div>
          </div>
        `;
      });

      const now = new Date();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const dayIndex = now.getDay();
      const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

      document.getElementById('updateTime').innerHTML = `
        <span class="update-dot"></span>
        <span>${month}月${date}日 · ${days[dayIndex]}</span>
      `;
    }

    async function fetchWeather() {
      try {
        const delayPromise = new Promise(resolve => setTimeout(resolve, 1500));
        const fetchPromise = fetch(API_URL).then(res => res.json());
        const [_, json] = await Promise.all([delayPromise, fetchPromise]);

        if (json.success) {
          renderWeather(json.data);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';
        } else {
          throw new Error("API Error");
        }
      } catch (e) {
        console.error(e);
        alert("天氣預言召喚失敗，可能是貓頭鷹在暴風雨中迷路了。請稍後再試一次！");
      }
    }

    document.addEventListener("DOMContentLoaded", fetchWeather);
  </script>
</body>

</html>
